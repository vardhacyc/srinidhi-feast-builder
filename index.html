    <!-- URL Rewrite Configuration -->
    <script>
      // URL Rewrite Rules Configuration
      const rewriteRules = [
        // Example: Redirect old URL patterns to new destinations
        // { pattern: /^\/about-old$/, destination: '/about', type: 'redirect' },
        // { pattern: /^\/services\/legacy$/, destination: '/services', type: 'redirect' },
        // Add your rewrite rules below:
        {
          pattern: /^\/catering-services$/,
          destination: "/#services",
          type: "redirect",
        },
      ];

      // Apply rewrite rules
      function applyRewrites() {
        const currentPath = window.location.pathname;

        for (const rule of rewriteRules) {
          if (rule.pattern.test(currentPath)) {
            if (rule.type === "redirect") {
              window.location.href = window.location.origin + rule.destination;
              return false;
            }
          }
        }
        return true;
      }

      // Apply on page load
      applyRewrites();
    </script>
